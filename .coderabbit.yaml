# CodeRabbit configuration
# See https://docs.coderabbit.ai/getting-started/configure-coderabbit
reviews:
  auto_review:
    enabled: false
  path_filters:
    # translation files are synced from Crowdin (1 file per language),
    # excluding them keeps PRs under the 100 files review limit
    - "!frontend/src/lib/i18n/messages/**"
    # data files
    - "!server/data/*.csv"
    # test data files
    - "!server/tests/data/taxonomies/**"
    - "!server/tests/data/*.json"
