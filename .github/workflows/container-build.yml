name: Container Build

on:
  push:
    branches:
      - 'main'
      - 'rc/*'
      - deploy/*
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push Score My Recipe Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_name: [
          "frontend",
          "server"
        ]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Define some envs based on the image name
        run: |
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> $GITHUB_ENV
          if [[ "${{ matrix.image_name }}" == "frontend" ]]; then
            echo "DOCKERFILE_CONTEXT=./frontend" >> $GITHUB_ENV
            echo "DOCKERFILE_PATH=./frontend/Dockerfile" >> $GITHUB_ENV
          elif [[ "${{ matrix.image_name }}" == "server" ]]; then
            echo "DOCKERFILE_CONTEXT=./server" >> $GITHUB_ENV
            echo "DOCKERFILE_PATH=./server/Dockerfile" >> $GITHUB_ENV
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.image_name }}
          # tag (by order of precedence)
          tags: |
            # release tags
            type=semver,pattern={{version}}
            # otherwise sha based tag
            type=raw,value=sha-${{ github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ env.DOCKERFILE_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest Docker image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        id: attest
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
