name: Container Build

on:
  push:
    branches:
      - 'main'
      - 'rc/*'
      - deploy/*
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push Score My Recipe Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_name: [
          "frontend",
          "server"
        ]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Define some envs based on the image name
        run: |
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> $GITHUB_ENV
          if [[ "${{ matrix.image_name }}" == "frontend" ]]; then
            echo "DOCKERFILE_CONTEXT=./frontend" >> $GITHUB_ENV
            echo "DOCKERFILE_PATH=./frontend/Dockerfile" >> $GITHUB_ENV
          elif [[ "${{ matrix.image_name }}" == "server" ]]; then
            echo "DOCKERFILE_CONTEXT=./server" >> $GITHUB_ENV
            echo "DOCKERFILE_PATH=./server/Dockerfile" >> $GITHUB_ENV
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.image_name }}
          # tag (by order of precedence)
          tags: |
            # release tags
            type=semver,pattern={{version}}
            # otherwise sha based tag
            type=raw,value=sha-${{ github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.DOCKERFILE_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest Docker image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
