name: '🏷️ PR Labeler'

on:
  pull_request_target:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: 'Label Pull Request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
