name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: setup just to have the right version
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.45.0'

      - name: Run dev setup
        run: ./scripts/dev-setup.sh full

      - name: Run checks
        run: just check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: setup just to have the right version
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.45.0'

      - name: Run dev setup
        run: ./scripts/dev-setup.sh full

      - name: Run e2e tests
        run: just e2e
